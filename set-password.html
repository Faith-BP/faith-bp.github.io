<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set Password · Faith BP Church Room Booking</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<header><div><strong>Faith BP Church Room Booking</strong></div><a href="./">Back to sign in</a></header>
<main>
<section class="card narrow">
<h1>Set your password</h1>
<p class="muted">Use this page to accept your invitation or reset your password.</p>
<div id="passwordPageStatus" class="notice" role="status">Checking your secure invitation or recovery link…</div>
<form id="setPasswordForm" class="hidden">
<label>New password<input id="setPassword" type="password" autocomplete="new-password" minlength="10" required></label>
<label>Confirm new password<input id="confirmSetPassword" type="password" autocomplete="new-password" minlength="10" required></label>
<button id="saveSetPassword" type="submit">Set password</button>
</form>
<p id="passwordPageHelp" class="muted">Passwords must be at least 10 characters.</p>
</section>
</main>
<script src="set-password.js?v=20261025-v1"></script>
</body></html>
